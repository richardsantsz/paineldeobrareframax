<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1F8;
    --panel:#FFFFFF;
    --ink:#132A52;
    --ink-soft:#5B6E8C;
    --line:#D3DCEC;
    --accent:#1F3D80;
    --accent-ink:#FFFFFF;
    --teal:#2A5CAE;
    --ok:#2F7A45;
    --ok-bg:#E4F3E7;
    --warn:#B9860F;
    --warn-bg:#FBF0DA;
    --bad:#B23A32;
    --bad-bg:#FBE4E1;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 60px;overflow-x:hidden;}

  /* Header — tag / work-order stub feel */
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;margin-bottom:6px;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand .logo{height:38px;width:auto;display:block;}
  .user-info{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .user-info .who{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .user-actions{display:flex;gap:6px;}
  .btn.small{padding:5px 10px;font-size:12px;}

  .login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .login-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:36px 32px;width:100%;max-width:340px;text-align:center;
    box-shadow:0 6px 24px rgba(19,42,82,0.08);
  }
  .login-card .logo{height:34px;width:auto;margin-bottom:18px;}
  .login-card h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;text-transform:uppercase;margin:0 0 2px;}
  .login-card form{display:flex;flex-direction:column;gap:12px;text-align:left;}
  .login-card label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;gap:5px;}
  .login-card input{font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);}
  .login-error{color:var(--bad);font-size:12.5px;font-weight:600;}

  .user-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin:16px 0;
  }
  .photo-modal-backdrop{
    position:fixed;inset:0;background:rgba(19,42,82,0.72);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:24px;
  }
  .photo-modal-content{
    position:relative;max-width:92vw;max-height:88vh;
  }
  .photo-modal-content img{
    max-width:92vw;max-height:88vh;display:block;
    border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,0.35);
  }
  .photo-modal-close{
    position:absolute;top:-38px;right:0;
    background:#fff;color:var(--ink);border:none;border-radius:var(--radius);
    padding:6px 12px;font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;
  }
  header.top h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:34px;letter-spacing:0.5px;
    margin:0;text-transform:uppercase;
  }
  header.top .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-soft);letter-spacing:0.5px;
  }
  .stamp{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-soft);text-align:right;
  }

  /* Tabs styled like folder tabs */
  nav.tabs{display:flex;gap:4px;margin-top:18px;}
  nav.tabs button{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;font-size:16px;letter-spacing:0.4px;text-transform:uppercase;
    background:#DADFE2;color:var(--ink-soft);
    border:none;border-radius:var(--radius) var(--radius) 0 0;
    padding:10px 22px 9px;cursor:pointer;
    position:relative;top:1px;
    transition:background .15s,color .15s;
  }
  nav.tabs button.active{
    background:var(--panel);color:var(--ink);
    box-shadow:0 -2px 0 var(--accent) inset;
  }
  nav.tabs button:hover:not(.active){background:#CFD5D8;}

  section.panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    padding:22px;
  }

  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .panel-head h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:0.4px;}
  .counts{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);
  }
  .chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);}
  .chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg);}
  .chip.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg);}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:var(--ink);color:#fff;border:none;border-radius:var(--radius);
    padding:9px 16px;cursor:pointer;
  }
  .btn:hover{background:#0f171c;}
  .btn.accent{background:var(--accent);}
  .btn.accent:hover{background:#16305F;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger-ghost{background:transparent;color:var(--bad);border:1px solid var(--bad);}

  form.entry{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;background:#F5F6F7;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:18px;
  }
  form.entry label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;gap:4px;}
  form.entry input,form.entry select,form.entry textarea{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:7px 9px;
    border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
  }
  form.entry textarea{resize:vertical;min-height:38px;}
  form.entry .full{grid-column:1/-1;}
  form.entry .actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:900px;}
  .table-scroll{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  .table-scroll table{border:none;}
  thead th{
    text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:600;
    text-transform:uppercase;font-size:12.5px;letter-spacing:0.3px;color:var(--ink-soft);
    border-bottom:2px solid var(--ink);padding:8px 10px;
  }
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:#F7F8F9;}
  .status-tag{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:3px 8px;border-radius:2px;font-weight:600;
  }
  .status-tag.ok{background:var(--ok-bg);color:var(--ok);}
  .status-tag.warn{background:var(--warn-bg);color:var(--warn);}
  .status-tag.bad{background:var(--bad-bg);color:var(--bad);}
  .row-actions{display:flex;gap:6px;}
  .status-select{
    font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;
    padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .date-input{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--ink);
  }
  .thumb{
    width:52px;height:52px;object-fit:cover;border-radius:var(--radius);
    border:1px solid var(--line);cursor:pointer;display:block;
  }
  .dropzone{
    border:2px dashed var(--line);border-radius:var(--radius);
    background:#fff;padding:16px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70px;transition:border-color .15s,background .15s;
  }
  .dropzone:hover{border-color:var(--teal);}
  .dropzone.over{border-color:var(--accent);background:#EAF1FF;}
  .dropzone #fotoDropzoneText{font-size:12.5px;color:var(--ink-soft);}
  .dropzone.has-image{padding:8px;}
  .dropzone img{max-width:100%;max-height:140px;border-radius:var(--radius);}
  .empty{padding:34px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--ink);text-transform:uppercase;margin-bottom:4px;}
  .mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .loading{padding:30px;text-align:center;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-size:12px;}
  @media(max-width:640px){
    header.top{flex-direction:column;align-items:flex-start;gap:6px;}
    nav.tabs button{padding:9px 14px;font-size:14px;}
  }
</style>
</head>

<div class="app" id="app">
  <div class="loading">Carregando painel…</div>
</div>

  const inicio = new Date(dateStr + 'T00:00:00');
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diasPassados = Math.floor((hoje - inicio) / DAY);
  const restante = cycleDays - diasPassados;
  if (restante < 0) return {code:'bad', label:'Vencido', restante};
  if (restante <= warnDays) return {code:'warn', label:'Vencendo', restante};
  return {code:'ok', label:'No Prazo', restante};
}
function ordemStatus(emissaoStr){ return daysStatus(emissaoStr, 42, 7); }
function notaVencimento(dataSolicitacaoStr){ return daysStatus(dataSolicitacaoStr, 16, 3); }

async function handleLogin(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const username = (fd.get('username')||'').toString().trim();
  const password = (fd.get('password')||'').toString();
  const match = usersList.find(u=>u.username===username && u.password===password);
  if(!match){
    loginError = 'Usuário ou senha inválidos.';
    renderLogin();
    return false;
  }
  loginError = '';
  currentUser = match;
  await loadAll();
  render();
  return false;
}

function handleLogout(){
  currentUser = null;
  loginError = '';
  renderLogin();
}

  const role = (fd.get('role')||'user').toString();

function fieldInput(f, val=''){

  if(f.type==='select'){
    return `<select name="${f.key}" ${f.required?'required':''}>

      ${f.options.map(o=>`<option value="${o}" ${v===o?'selected':''}>${o}</option>`).join('')}
    </select>`;
  }
  if(f.type==='textarea'){
    return `<textarea name="${f.key}" ${f.required?'required':''}>${v}</textarea>`;
  }
  return `<input type="${f.type}" name="${f.key}" value="${v}" ${f.required?'required':''}/>`;
}

function readAndCompressImage(file, maxWidth=1000, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(''); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let notaFotoData = '';

async function processFotoFile(file){
  if(!file || file.size===0) return;
  try{
    notaFotoData = await readAndCompressImage(file);
    const zone = document.getElementById('fotoDropzone');
    const img = document.getElementById('fotoPreview');
    const txt = document.getElementById('fotoDropzoneText');
    if(zone && img){
      img.src = notaFotoData;
      img.style.display = 'block';
      if(txt) txt.style.display = 'none';
      zone.classList.add('has-image');
    }
  }catch(e){ console.error('Falha ao processar foto', e); }
}
function handleFotoDrop(ev){
  ev.preventDefault();
  ev.currentTarget.classList.remove('over');
  const file = ev.dataTransfer.files && ev.dataTransfer.files[0];
  processFotoFile(file);
}
function handleFotoInputChange(ev){
  const file = ev.target.files && ev.target.files[0];
  processFotoFile(file);
}

async function handleAdd(ev, tab){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const item = { id: uid(), criadoEm: Date.now() };
  FIELDS[tab].forEach(f=>{ item[f.key] = (fd.get(f.key)||'').toString().trim(); });
  if(tab==='notas'){
    item.status = 'Aberta';
    item.foto = notaFotoData || '';
    notaFotoData = '';
  }
  state[tab].push(item);
  formOpen[tab] = false;
  render();
  await saveTab(tab);
  return false;
}

async function updateNotaField(id, field, value){
  const item = state.notas.find(n=>n.id===id);
  if(!item) return;
  item[field] = value;
  render();
  await saveTab('notas');
}

async function removeItem(tab, id){
  state[tab] = state[tab].filter(i=>i.id!==id);
  render();
  await saveTab(tab);
}
