<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#EDF1F8;
    --panel:#FFFFFF;
    --ink:#132A52;
    --ink-soft:#5B6E8C;
    --line:#D3DCEC;
    --accent:#1F3D80;
    --accent-ink:#FFFFFF;
    --teal:#2A5CAE;
    --ok:#2F7A45;
    --ok-bg:#E4F3E7;
    --warn:#B9860F;
    --warn-bg:#FBF0DA;
    --bad:#B23A32;
    --bad-bg:#FBE4E1;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 60px;overflow-x:hidden;}

  /* Header — tag / work-order stub feel */
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;margin-bottom:6px;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand .logo{height:38px;width:auto;display:block;}
  .user-info{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .user-info .who{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .user-actions{display:flex;gap:6px;}
  .btn.small{padding:5px 10px;font-size:12px;}

  .login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .login-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:36px 32px;width:100%;max-width:340px;text-align:center;
    box-shadow:0 6px 24px rgba(19,42,82,0.08);
  }
  .login-card .logo{height:34px;width:auto;margin-bottom:18px;}
  .login-card h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;text-transform:uppercase;margin:0 0 2px;}
  .login-card form{display:flex;flex-direction:column;gap:12px;text-align:left;}
  .login-card label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;gap:5px;}
  .login-card input{font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);}
  .login-error{color:var(--bad);font-size:12.5px;font-weight:600;}

  .user-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin:16px 0;
  }
  .photo-modal-backdrop{
    position:fixed;inset:0;background:rgba(19,42,82,0.72);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:24px;
  }
  .photo-modal-content{
    position:relative;max-width:92vw;max-height:88vh;
  }
  .photo-modal-content img{
    max-width:92vw;max-height:88vh;display:block;
    border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,0.35);
  }
  .photo-modal-close{
    position:absolute;top:-38px;right:0;
    background:#fff;color:var(--ink);border:none;border-radius:var(--radius);
    padding:6px 12px;font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;
  }
  .panel-head-actions{display:flex;gap:8px;align-items:center;}
  .search-bar{margin-bottom:10px;}
  .search-input{
    width:100%;font-family:'Inter',sans-serif;font-size:14px;
    padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--ink);
  }
  .search-input:focus{outline:none;border-color:var(--accent);}
  .filter-bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    background:#F5F6F7;border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:14px;
  }
  .filter-field{display:flex;flex-direction:column;font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;gap:4px;position:relative;}
  .filter-field select{
    font-family:'Inter',sans-serif;font-size:13px;padding:6px 8px;
    border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);min-width:140px;
  }
  .filter-field-label{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
  .filter-dropdown-btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;
    padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
    cursor:pointer;min-width:150px;text-align:left;white-space:nowrap;
  }
  .filter-dropdown-btn.active{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .filter-dropdown-panel{
    position:absolute;top:100%;left:0;margin-top:4px;z-index:50;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(19,42,82,0.14);padding:8px;min-width:210px;max-height:240px;overflow-y:auto;
  }
  .filter-checkbox{
    display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:13px;font-weight:400;
    text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer;white-space:nowrap;
  }
  .filter-checkbox input{cursor:pointer;}

  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .dash-card{
    background:#F5F7FB;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;text-align:center;
  }
  .dash-card.bad{background:var(--bad-bg);border-color:var(--bad);}
  .dash-card.warn{background:var(--warn-bg);border-color:var(--warn);}
  .dash-card.ok{background:var(--ok-bg);border-color:var(--ok);}
  .dash-num{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;color:var(--ink);}
  .dash-label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}

  .dash-block{margin-bottom:36px;padding-bottom:8px;}
  .dash-block-ordens{border-bottom:3px dashed var(--line);padding-bottom:32px;}
  .dash-block-title{
    font-family:'Barlow Condensed',sans-serif;font-size:26px;text-transform:uppercase;
    letter-spacing:0.4px;margin:0 0 16px;color:var(--ink);
    border-left:5px solid var(--accent);padding-left:12px;
  }

  .dash-section{margin-bottom:26px;}
  .dash-section h3{
    font-family:'Barlow Condensed',sans-serif;font-size:18px;text-transform:uppercase;
    letter-spacing:0.3px;margin:0 0 12px;border-bottom:2px solid var(--line);padding-bottom:6px;
  }
  .dash-two-col{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:8px;}
  @media(max-width:760px){ .dash-two-col{grid-template-columns:1fr;} }

  .pie-block{background:#FAFBFD;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .pie-block h4{
    font-family:'Barlow Condensed',sans-serif;font-size:16px;text-transform:uppercase;
    letter-spacing:0.3px;margin:0 0 14px;color:var(--ink);
  }
  .pie-body{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .pie-empty{font-size:13px;color:var(--ink-soft);}
  .pie-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;}
  .pie-legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);}
  .pie-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .pie-legend-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pie-legend-count{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .pie-legend-clickable{cursor:pointer;border-radius:4px;padding:3px 4px;margin:0 -4px;transition:background .12s;}
  .pie-legend-clickable:hover{background:#EDF1F8;}
  .pie-slice-clickable{cursor:pointer;transition:opacity .12s;}
  .pie-slice-clickable:hover{opacity:0.8;}
  .pie-hint{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-soft);margin-left:8px;}
  .bar-row-clickable{cursor:pointer;border-radius:4px;padding:3px 4px;margin:0 -4px 5px;transition:background .12s;}
  .bar-row-clickable:hover{background:#EDF1F8;}

  .bar-row{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-label{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{background:#EDF1F8;border-radius:20px;height:12px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:20px;transition:width .3s;}
  .bar-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);text-align:right;}
  header.top h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:34px;letter-spacing:0.5px;
    margin:0;text-transform:uppercase;
  }
  header.top .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-soft);letter-spacing:0.5px;
  }
  .stamp{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-soft);text-align:right;
  }

  /* Tabs styled like folder tabs */
  nav.tabs{display:flex;gap:4px;margin-top:18px;}
  nav.tabs button{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;font-size:16px;letter-spacing:0.4px;text-transform:uppercase;
    background:#DADFE2;color:var(--ink-soft);
    border:none;border-radius:var(--radius) var(--radius) 0 0;
    padding:10px 22px 9px;cursor:pointer;
    position:relative;top:1px;
    transition:background .15s,color .15s;
  }
  nav.tabs button.active{
    background:var(--panel);color:var(--ink);
    box-shadow:0 -2px 0 var(--accent) inset;
  }
  nav.tabs button:hover:not(.active){background:#CFD5D8;}

  section.panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    padding:22px;
  }

  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .panel-head h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:0.4px;}
  .counts{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);
  }
  .chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);}
  .chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg);}
  .chip.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg);}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:var(--ink);color:#fff;border:none;border-radius:var(--radius);
    padding:9px 16px;cursor:pointer;
  }
  .btn:hover{background:#0f171c;}
  .btn.accent{background:var(--accent);}
  .btn.accent:hover{background:#16305F;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger-ghost{background:transparent;color:var(--bad);border:1px solid var(--bad);}

  form.entry{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;background:#F5F6F7;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:18px;
  }
  form.entry label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;gap:4px;}
  form.entry input,form.entry select,form.entry textarea{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:7px 9px;
    border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
  }
  form.entry textarea{resize:vertical;min-height:38px;}
  form.entry .full{grid-column:1/-1;}
  form.entry .actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:900px;}
  .table-scroll{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  .table-scroll table{border:none;}
  thead th{
    text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:600;
    text-transform:uppercase;font-size:12.5px;letter-spacing:0.3px;color:var(--ink-soft);
    border-bottom:2px solid var(--ink);padding:8px 10px;
  }
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:#F7F8F9;}
  .status-tag{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:3px 8px;border-radius:2px;font-weight:600;
  }
  .status-tag.ok{background:var(--ok-bg);color:var(--ok);}
  .status-tag.warn{background:var(--warn-bg);color:var(--warn);}
  .status-tag.bad{background:var(--bad-bg);color:var(--bad);}
  .row-actions{display:flex;gap:6px;}
  .status-select{
    font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;
    padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .status-select.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);}
  .status-select.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg);}
  .status-select.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);}
  .date-input{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--ink);
  }
  .thumb{
    width:52px;height:52px;object-fit:cover;border-radius:var(--radius);
    border:1px solid var(--line);cursor:pointer;display:block;
  }
  .dropzone{
    border:2px dashed var(--line);border-radius:var(--radius);
    background:#fff;padding:16px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70px;transition:border-color .15s,background .15s;
  }
  .dropzone:hover{border-color:var(--teal);}
  .dropzone.over{border-color:var(--accent);background:#EAF1FF;}
  .dropzone #fotoDropzoneText{font-size:12.5px;color:var(--ink-soft);}
  .dropzone.has-image{padding:8px;}
  .dropzone img{max-width:100%;max-height:140px;border-radius:var(--radius);}
  .empty{padding:34px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--ink);text-transform:uppercase;margin-bottom:4px;}
  .mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .loading{padding:30px;text-align:center;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-size:12px;}
  @media(max-width:640px){
    header.top{flex-direction:column;align-items:flex-start;gap:6px;}
    nav.tabs button{padding:9px 14px;font-size:14px;}
  }
</style>
</head>

<div class="app" id="app">
  <div class="loading">Carregando painel…</div>
</div>

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout')), ms))
  ]);
}

async function storageGet(key, shared){
  if(db){
    try{
      const doc = await withTimeout(db.collection('painel-obra-data').doc(key).get(), 8000);
      if(!doc.exists) return null;
      return {key, value: doc.data().value, shared: !!shared};
    }catch(e){ console.error('storageGet (Firestore) falhou', e); }
  }
  try{
    const raw = localStorage.getItem((shared?'shared:':'local:')+key);
    return raw!==null ? {key, value: raw, shared: !!shared} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(db){
    try{
      await withTimeout(db.collection('painel-obra-data').doc(key).set({value, updatedAt: Date.now()}), 8000);
      return {key, value, shared: !!shared};
    }catch(e){ console.error('storageSet (Firestore) falhou', e); }
  }
  try{
    localStorage.setItem((shared?'shared:':'local:')+key, value);
    return {key, value, shared: !!shared};
  }catch(e){ return null; }
}

let openFilterDropdown = null;

function toggleFilterDropdown(tab, key){
  openFilterDropdown = (openFilterDropdown && openFilterDropdown.tab===tab && openFilterDropdown.key===key)
    ? null : {tab, key};
  render();
}
function toggleFilterValue(tab, key, value){
  const cur = filterState[tab][key] || [];
  filterState[tab][key] = cur.includes(value) ? cur.filter(v=>v!==value) : [...cur, value];
  render();
}
function clearOneFilter(tab, key){
  delete filterState[tab][key];
  render();
}
function clearFilters(tab){
  filterState[tab] = {};
  openFilterDropdown = null;
  render();
}
function uniqueValues(arr, key){
  return [...new Set(arr.map(x=>x[key]).filter(v=>v!==undefined && v!==null && v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));
}
function filterSelect(tab, key, label, options){
  const selected = filterState[tab][key] || [];
  const isOpen = openFilterDropdown && openFilterDropdown.tab===tab && openFilterDropdown.key===key;
  const btnLabel = selected.length===0 ? 'Todos' : (selected.length===1 ? selected[0] : `${selected.length} selecionados`);
  return `<div class="filter-field">
    <span class="filter-field-label">${label}</span>
    <button type="button" class="filter-dropdown-btn ${selected.length?'active':''}" onclick="toggleFilterDropdown('${tab}','${key}')">${btnLabel} ▾</button>
    ${isOpen ? `<div class="filter-dropdown-panel">
      ${options.map(o=>`<label class="filter-checkbox">
        <input type="checkbox" ${selected.includes(o)?'checked':''} onchange="toggleFilterValue('${tab}','${key}','${o.replace(/'/g,"\\'")}')"/>
        <span>${o}</span>
      </label>`).join('')}
      ${selected.length ? `<button type="button" class="btn ghost small" style="margin-top:6px;width:100%;" onclick="clearOneFilter('${tab}','${key}')">Limpar</button>` : ''}
    </div>` : ''}
  </div>`;
}
function applyFilters(tab, rows, matchers){
  const f = filterState[tab];
  const active = Object.keys(f).filter(k=> f[k] && f[k].length>0);
  if(active.length===0) return rows;
  return rows.filter(r=> active.every(k=> matchers[k] ? matchers[k](r, f[k]) : true));
}

  const diasPassados = Math.floor((hoje - inicio) / DAY);

  ev.preventDefault();
  const fd = new FormData(ev.target);
  const username = (fd.get('username')||'').toString().trim();
  const password = (fd.get('password')||'').toString();
  const match = usersList.find(u=>u.username===username && u.password===password);
  if(!match){
    loginError = 'Usuário ou senha inválidos.';
    renderLogin();
    return false;
  }
  loginError = '';
  currentUser = match;
  await loadAll();
  render();
  return false;
}

function notaDeadline(dataSolicitacao){
  if(!dataSolicitacao) return null;
  const d = new Date(dataSolicitacao + 'T00:00:00');
  d.setDate(d.getDate() + 16);
  return d;
}

function getWeekRange(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diaSemana = hoje.getDay(); // 0=domingo
  const offsetSegunda = diaSemana===0 ? -6 : 1-diaSemana;
  const segunda = new Date(hoje); segunda.setDate(hoje.getDate()+offsetSegunda);
  const domingo = new Date(segunda); domingo.setDate(segunda.getDate()+6); domingo.setHours(23,59,59,999);
  return {segunda, domingo};
}

function notasVencendoSemana(){
  const {segunda, domingo} = getWeekRange();
  return state.notas.filter(n=>{
    const dl = notaDeadline(n.dataSolicitacao);
    return dl && dl>=segunda && dl<=domingo;
  }).sort((a,b)=> notaDeadline(a.dataSolicitacao) - notaDeadline(b.dataSolicitacao));
}

function notasAVencer7Dias(){
  return state.notas.filter(n=>{
    const v = notaVencimento(n.dataSolicitacao);
    return v.restante>=0 && v.restante<=7;
  }).sort((a,b)=> notaVencimento(a.dataSolicitacao).restante - notaVencimento(b.dataSolicitacao).restante);
}

function notasDaSemanaPorSituacao(situacoes){
  const {segunda, domingo} = getWeekRange();
  return state.notas.filter(n=>{
    if(!situacoes.includes(n.situacaoVisita)) return false;
    if(!n.atualizadoEm) return false;
    const d = new Date(n.atualizadoEm);
    return d>=segunda && d<=domingo;
  }).sort((a,b)=> (b.atualizadoEm||0)-(a.atualizadoEm||0));
}

function barRow(label, count, total, colorVar, onFilter){
  const pct = total>0 ? Math.round((count/total)*100) : 0;
  const clickAttr = onFilter ? `onclick="goToFilter('${onFilter.tab}','${onFilter.key}','${String(label).replace(/'/g,"\\'")}')"` : '';
  const cls = onFilter ? 'bar-row bar-row-clickable' : 'bar-row';
  return `<div class="${cls}" ${clickAttr}>
    <div class="bar-label">${label}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colorVar};"></div></div>
    <div class="bar-count">${count}</div>
  </div>`;
}

function countBy(arr, keyFn){
  const map = {};
  arr.forEach(item=>{
    const k = keyFn(item) || '—';
    map[k] = (map[k]||0) + 1;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

const CHART_COLORS = ['#1F3D80','#2A5CAE','#5B8FD6','#2F7A45','#B9860F','#B23A32','#7B5EA7','#3F9B8E','#C2680C','#6D7A8C'];

function pieChart(segments, size, onFilter){
  size = size || 168;
  const total = segments.reduce((a,s)=>a+s.count,0);
  if(total===0) return `<div class="pie-empty">Sem dados</div>`;
  const cx=size/2, cy=size/2, r=size/2-6;
  let startAngle = -90;
  const parts = segments.filter(s=>s.count>0).map(s=>{
    const angle = (s.count/total)*360;
    const endAngle = startAngle+angle;
    const large = angle>180?1:0;
    const x1 = cx + r*Math.cos(startAngle*Math.PI/180);
    const y1 = cy + r*Math.sin(startAngle*Math.PI/180);
    const x2 = cx + r*Math.cos(endAngle*Math.PI/180);
    const y2 = cy + r*Math.sin(endAngle*Math.PI/180);
    const d = angle>=360
      ? `M${cx},${cy-r} A${r},${r} 0 1 1 ${cx-0.01},${cy-r} Z`
      : `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    startAngle = endAngle;
    const clickAttr = onFilter ? ` onclick="goToFilter('${onFilter.tab}','${onFilter.key}','${String(s.label).replace(/'/g,"\\'")}')" class="pie-slice-clickable"` : '';
    return `<path d="${d}" fill="${s.color}"${clickAttr}><title>${s.label}: ${s.count}</title></path>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${parts}
    <circle cx="${cx}" cy="${cy}" r="${r*0.56}" fill="var(--panel)"/>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="22" fill="var(--ink)">${total}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--ink-soft)">total</text>
  </svg>`;
}

function pieLegend(segments, onFilter){
  const total = segments.reduce((a,s)=>a+s.count,0);
  return `<div class="pie-legend">
    ${segments.map(s=>{
      const pct = total>0 ? Math.round((s.count/total)*100) : 0;
      const clickAttr = onFilter ? ` onclick="goToFilter('${onFilter.tab}','${onFilter.key}','${String(s.label).replace(/'/g,"\\'")}')"` : '';
      const cls = onFilter ? 'pie-legend-row pie-legend-clickable' : 'pie-legend-row';
      return `<div class="${cls}"${clickAttr}>
        <span class="pie-swatch" style="background:${s.color};"></span>
        <span class="pie-legend-label">${s.label}</span>
        <span class="pie-legend-count">${s.count} · ${pct}%</span>
      </div>`;
    }).join('')}
  </div>`;
}

function pieBlock(title, segments, onFilter){
  return `<div class="pie-block">
    <h4>${title}${onFilter ? '<span class="pie-hint">clique para filtrar</span>' : ''}</h4>
    <div class="pie-body">
      ${pieChart(segments, null, onFilter)}
      ${pieLegend(segments, onFilter)}
    </div>
  </div>`;
}

function excelDateToStr(v){
  if(v==null || v==='') return '';
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(!d) return '';
    const mm = String(d.m).padStart(2,'0'), dd = String(d.d).padStart(2,'0');
    return `${d.y}-${mm}-${dd}`;
  }
  if(v instanceof Date){
    return v.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const m2 = s.match(/^\d{4}-\d{2}-\d{2}/);
  if(m2) return m2[0];
  return '';
}
function cell(v){ return (v==null) ? '' : String(v).trim(); }

function findSheet(wb, nameGuess){
  const found = wb.SheetNames.find(n=>n.toLowerCase().includes(nameGuess.toLowerCase()));
  return found ? wb.Sheets[found] : null;
}

function upsertByNumero(list, incoming, extraDefaults){
  incoming.forEach(item=>{
    const idx = list.findIndex(x=>x.numero===item.numero);
    if(idx>=0){
      list[idx] = { ...list[idx], ...item };
    } else {
      list.push({ id: uid(), criadoEm: Date.now(), ...extraDefaults, ...item });
    }
  });
}

async function handleImportFile(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    alert('Não foi possível carregar o leitor de planilhas. Verifique sua conexão e tente novamente.');
    return;
  }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:false});

  if(activeTab==='notas'){
    const sheet = findSheet(wb, 'Controle de Notas');
    if(!sheet){ alert('Não encontrei uma aba "Controle de Notas" nessa planilha.'); return; }
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
    let headerIdx = rows.findIndex(r=>r[2]==='Nota');
    if(headerIdx<0){ alert('Não reconheci o formato da aba de notas.'); return; }
    const headers = rows[headerIdx];
    const idxOf = name => headers.indexOf(name);
    const iNota = idxOf('Nota'), iArea = idxOf('Cliente/Área'), iDesc = idxOf('Descrição do Orçamento'),
          iDataSol = idxOf('Data Solicitação'), iSolic = idxOf('Solicitante'), iTel = idxOf('Telefone Encontrado '),
          iCC = idxOf('Centro de Custo'), iResp = idxOf('Responsável'), iVisita = idxOf('Data de visita'),
          iStatus = idxOf('Status ');
    const incoming = [];
    const seen = new Set();
    for(let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i];
      const numero = cell(r[iNota]);
      if(!numero || seen.has(numero)) continue;
      seen.add(numero);
      const statusRaw = cell(r[iStatus]);
      incoming.push({
        numero, area: cell(r[iArea]), texto: cell(r[iDesc]),
        dataSolicitacao: excelDateToStr(r[iDataSol]),
        solicitante: cell(r[iSolic]), telefone: cell(r[iTel]),
        centroCusto: cell(r[iCC]), responsavel: cell(r[iResp]),
        dataVisita: excelDateToStr(r[iVisita]),
        status: statusRaw==='CONCLUIDO' ? 'Concluída' : (statusRaw==='PENDENTE' ? 'Aberta' : undefined),
      });
    }
    incoming.forEach(it=>{ if(it.status===undefined) delete it.status; });
    upsertByNumero(state.notas, incoming, {status:'Pendente', foto:''});
    render();
    await saveTab('notas');
    alert(`${incoming.length} nota(s) importada(s)/atualizada(s).`);
  } else if(activeTab==='ordens'){
    const sheet = findSheet(wb, 'Controle de Ordens');
    if(!sheet){ alert('Não encontrei uma aba "Controle de Ordens" nessa planilha.'); return; }
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
    const headers = rows[0];
    const idxOf = name => headers.indexOf(name);
    const iOrdem = idxOf('Ordem'), iArea = idxOf('Área'), iDesc = idxOf('Descrição do Orçamento'),
          iEmissao = idxOf('Data de criação da ordem'), iResp = idxOf('Solicitante');
    const incoming = [];
    const seen = new Set();
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      const numero = cell(r[iOrdem]);
      const emissao = excelDateToStr(r[iEmissao]);
      if(!numero || !emissao || seen.has(numero)) continue;
      seen.add(numero);
      incoming.push({ numero, area: cell(r[iArea]), descricao: cell(r[iDesc]), emissao, responsavel: cell(r[iResp]) });
    }
    upsertByNumero(state.ordens, incoming, {});
    render();
    await saveTab('ordens');
    alert(`${incoming.length} ordem(ns) importada(s)/atualizada(s).`);
  } else {
    alert('Importação disponível apenas nas abas Ordens e Notas.');
  }
}

function readAndCompressImage(file, maxWidth=1000, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(''); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let notaFotoData = '';

async function processFotoFile(file){
  if(!file || file.size===0) return;
  try{
    notaFotoData = await readAndCompressImage(file);
    const zone = document.getElementById('fotoDropzone');
    const img = document.getElementById('fotoPreview');
    const txt = document.getElementById('fotoDropzoneText');
    if(zone && img){
      img.src = notaFotoData;
      img.style.display = 'block';
      if(txt) txt.style.display = 'none';
      zone.classList.add('has-image');
    }
  }catch(e){ console.error('Falha ao processar foto', e); }
}
function handleFotoDrop(ev){
  ev.preventDefault();
  ev.currentTarget.classList.remove('over');
  const file = ev.dataTransfer.files && ev.dataTransfer.files[0];
  processFotoFile(file);
}
function handleFotoInputChange(ev){
  const file = ev.target.files && ev.target.files[0];
  processFotoFile(file);
}

async function handleAdd(ev, tab){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const item = { id: uid(), criadoEm: Date.now() };
  FIELDS[tab].forEach(f=>{ item[f.key] = (fd.get(f.key)||'').toString().trim(); });
  if(tab==='notas'){
    item.status = 'Pendente';
    item.foto = notaFotoData || '';
    notaFotoData = '';
  }
  state[tab].push(item);
  formOpen[tab] = false;
  render();
  await saveTab(tab);
  return false;
}

async function updateNotaField(id, field, value){
  const item = state.notas.find(n=>n.id===id);
  if(!item) return;
  item[field] = value;
  if(field==='situacaoVisita' || field==='status'){ item.atualizadoEm = Date.now(); }
  render();
  await saveTab('notas');
}

async function removeItem(tab, id){
  state[tab] = state[tab].filter(i=>i.id!==id);
  render();
  await saveTab(tab);
}
